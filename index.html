<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تواصل معنا</title>
<style>
body{
font-family: Arial;
background:#f5f5f5;
text-align:center;
padding:30px;
}
form{
background:white;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}
input, textarea{
width:90%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}
button{
background:#007bff;
color:white;
padding:10px 20px;
border:none;
border-radius:6px;
cursor:pointer;
}
button:hover{
background:#0056b3;
}
</style>
</head>

<body>

<h2>اترك رسالة</h2>

<form action="https://formspree.io/f/xwvnbbpk" method="POST">

<input type="text" name="name" placeholder="اكتب اسمك" required>

<input type="email" name="email" placeholder="اكتب بريدك الإلكتروني" required>

<textarea name="message" placeholder="اكتب رسالتك" required></textarea>

<button type="submit">إرسال</button>

</form>

</body>
</html>
